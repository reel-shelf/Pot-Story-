name: Update results

on:
  schedule:
    # Every 30 minutes from 8am to 9:30pm Jamaica time (13:00-02:30 UTC)
    - cron: "10,40 13-23 * * *"
    - cron: "10,40 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get Cash Pot results
        run: python update_results.py
      - name: Save results
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Update Cash Pot results"
          git push
